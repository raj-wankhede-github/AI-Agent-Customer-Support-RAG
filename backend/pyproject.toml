[project]
name = "support-agent-backend"
version = "0.1.0"
description = "Grounded customer-support RAG agent (FastAPI backend)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "gunicorn>=26.2,<27",
    "uvicorn-worker>=0.4,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0.53,<2.1",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<1",
    "httpx>=0.28,<1",
    "structlog>=26.1,<27",
    "pyjwt>=2.14,<3",
    "argon2-cffi>=25.1,<26",
    "python-multipart>=0.0.32,<1",
    "pypdf>=6.18,<7",
    "python-docx>=1.2,<2",
    "anthropic>=1.5,<2",
]

[project.optional-dependencies]
# Only needed when STORAGE_PROVIDER=s3. Installed in the Docker image.
s3 = ["boto3>=1.43,<2"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC240"]
"app/cli.py" = ["S106"]
"alembic/**" = ["E501"]
# Only the integer vector dimension is interpolated into SQL (casts/partial-index predicates cannot be bound).
"app/rag/retriever.py" = ["S608"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL with pgvector (TEST_DATABASE_URL)",
    "e2e: full API workflow against PostgreSQL",
]
